<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Notes - StudentHub4U</title>

    <link rel="stylesheet" href="style.css">

    <style>

        /* =========================================
           PAGE
        ========================================= */

        .notes-page {
            min-height: 100vh;
            padding: 30px 20px 80px;
        }


        /* =========================================
           TOP HEADER
        ========================================= */

        .notes-top {
            width: 100%;
            max-width: 1120px;
            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 10px 18px;

            color: #fff;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.04);

            border: 1px solid rgba(255, 255, 255, 0.12);

            border-radius: 10px;

            transition: 0.3s ease;
        }

        .back-link:hover {
            color: #fff;

            border-color: #ff1e2d;

            background: rgba(255, 30, 45, 0.10);

            box-shadow:
                0 0 15px rgba(255, 30, 45, 0.20);

            transform: translateX(-3px);
        }


        /* =========================================
           HEADING
        ========================================= */

        .notes-heading {
            width: 100%;
            max-width: 1120px;

            margin: 25px auto 0;

            text-align: center;
        }

        .board-name {
            display: inline-block;

            margin-bottom: 12px;

            color: #ff1e2d;

            font-size: 13px;
            font-weight: 800;

            letter-spacing: 3px;

            text-transform: uppercase;
        }

        .notes-heading h1 {
            margin: 0;

            color: #fff;

            font-size: clamp(28px, 5vw, 44px);

            font-weight: 800;

            line-height: 1.2;
        }

        .notes-heading h1 span {
            color: #ff1e2d;
        }

        .notes-heading p {
            margin: 12px 0 0;

            color: #999;

            font-size: 15px;
        }


        /* =========================================
           RED LINE
        ========================================= */

        .heading-line {
            width: 90px;
            height: 3px;

            margin: 20px auto 0;

            border-radius: 50px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff1e2d,
                    #ff6872,
                    #ff1e2d,
                    transparent
                );

            box-shadow:
                0 0 10px #ff1e2d,
                0 0 25px rgba(255, 30, 45, 0.5);
        }


        /* =========================================
           CHAPTER GRID
        ========================================= */

        .chapter-list {
            width: 100%;
            max-width: 1120px;

            margin: 45px auto 0;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
        }


        /* =========================================
           CHAPTER CARD
        ========================================= */

        .chapter-card {
            position: relative;

            min-height: 205px;

            padding: 24px;

            display: flex;
            flex-direction: column;

            justify-content: space-between;

            text-decoration: none !important;

            color: #fff !important;

            background:
                linear-gradient(
                    145deg,
                    rgba(22, 22, 25, 0.98),
                    rgba(7, 7, 9, 0.98)
                );

            border:
                1px solid rgba(255, 255, 255, 0.08);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.45);

            transform: translateY(0);

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease,
                background 0.4s ease;
        }


        /* =========================================
           MOVING RED LIGHT
        ========================================= */

        .chapter-card::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 100%;
            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #ff1e2d,
                    #ff6872,
                    #ff1e2d,
                    transparent
                );

            box-shadow:
                0 0 10px #ff1e2d,
                0 0 20px rgba(255, 30, 45, 0.8);

            transition: left 0.8s ease;
        }

        .chapter-card:hover::before {
            left: 120%;
        }


        /* =========================================
           RED AMBIENT GLOW
        ========================================= */

        .chapter-card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            right: -100px;
            bottom: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 30, 45, 0.25),
                    transparent 70%
                );

            opacity: 0.45;

            transition:
                transform 0.5s ease,
                opacity 0.5s ease;

            pointer-events: none;
        }


        /* =========================================
           HOVER
        ========================================= */

        .chapter-card:hover {
            transform:
                translateY(-9px)
                scale(1.015);

            border-color:
                rgba(255, 30, 45, 0.75);

            background:
                linear-gradient(
                    145deg,
                    rgba(28, 10, 12, 0.98),
                    rgba(9, 7, 9, 0.98)
                );

            box-shadow:
                0 18px 45px rgba(0, 0, 0, 0.65),
                0 0 20px rgba(255, 30, 45, 0.16),
                inset 0 0 25px rgba(255, 30, 45, 0.035);
        }

        .chapter-card:hover::after {
            transform: scale(1.7);
            opacity: 0.8;
        }


        /* =========================================
           NUMBER
        ========================================= */

        .chapter-number {
            position: relative;
            z-index: 2;

            width: 40px;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 2px;

            color: #ff1e2d;

            transition:
                transform 0.35s ease,
                text-shadow 0.35s ease;
        }

        .chapter-card:hover .chapter-number {
            transform: translateX(4px);

            text-shadow:
                0 0 8px #ff1e2d,
                0 0 18px rgba(255, 30, 45, 0.8);
        }


        /* =========================================
           CHAPTER INFO
        ========================================= */

        .chapter-info {
            position: relative;

            z-index: 2;

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding: 12px 0;
        }

        .chapter-info h3 {
            margin: 0 0 12px;

            color: #fff !important;

            font-size: 18px;

            line-height: 1.55;

            font-weight: 700;

            text-decoration: none !important;

            transition:
                transform 0.3s ease,
                text-shadow 0.3s ease;
        }

        .chapter-card:hover .chapter-info h3 {
            transform: translateX(4px);

            text-shadow:
                0 0 12px rgba(255, 255, 255, 0.18);
        }


        /* =========================================
           SUBTITLE
        ========================================= */

        .chapter-info p {
            margin: 0;

            color: #888b91 !important;

            font-size: 13px;

            text-decoration: none !important;

            transition: color 0.3s ease;
        }

        .chapter-card:hover .chapter-info p {
            color: #b8b8bd !important;
        }


        /* =========================================
           ARROW
        ========================================= */

        .chapter-arrow {
            position: absolute;

            right: 20px;
            bottom: 18px;

            width: 38px;
            height: 38px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: #ff1e2d;

            background:
                rgba(255, 30, 45, 0.07);

            border:
                1px solid rgba(255, 30, 45, 0.25);

            font-size: 19px;

            transition: all 0.35s ease;
        }

        .chapter-card:hover .chapter-arrow {
            color: #fff;

            background: #ff1e2d;

            border-color: #ff1e2d;

            box-shadow:
                0 0 10px rgba(255, 30, 45, 0.7),
                0 0 25px rgba(255, 30, 45, 0.45);

            transform: translateX(5px);
        }


        /* =========================================
           CLICK ANIMATION
        ========================================= */

        .chapter-card.clicked {
            transform: scale(0.94);

            border-color: #ff1e2d;

            box-shadow:
                0 0 15px #ff1e2d,
                0 0 35px rgba(255, 30, 45, 0.7),
                0 0 75px rgba(255, 30, 45, 0.3);
        }

        .chapter-card.clicked::before {
            left: 120%;
        }


        /* =========================================
           TABLET
        ========================================= */

        @media (max-width: 1000px) {

            .chapter-list {
                grid-template-columns:
                    repeat(2, 1fr);

                padding: 0 15px;
            }

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .notes-page {
                padding:
                    20px 12px 60px;
            }

            .notes-top {
                align-items: flex-start;
            }

            .back-link {
                padding:
                    9px 13px;

                font-size: 13px;
            }

            .notes-heading {
                margin-top: 20px;
            }

            .notes-heading h1 {
                font-size: 28px;
            }

            .notes-heading p {
                font-size: 14px;
            }

            .chapter-list {
                grid-template-columns: 1fr;

                gap: 15px;

                margin-top: 30px;

                padding: 0;
            }

            .chapter-card {
                min-height: 175px;

                padding: 20px;

                border-radius: 16px;
            }

            .chapter-info h3 {
                font-size: 17px;

                padding-right: 35px;
            }

            .chapter-info p {
                font-size: 12px;
            }

            .chapter-arrow {
                right: 16px;
                bottom: 16px;

                width: 36px;
                height: 36px;
            }

        }


        /* =========================================
           SMALL PHONE
        ========================================= */

        @media (max-width: 400px) {

            .notes-page {
                padding:
                    16px 10px 50px;
            }

            .notes-heading h1 {
                font-size: 25px;
            }

            .board-name {
                font-size: 11px;
                letter-spacing: 2px;
            }

            .chapter-card {
                min-height: 165px;

                padding: 18px;
            }

            .chapter-info h3 {
                font-size: 16px;
            }

            .chapter-number {
                font-size: 12px;
            }

        }


        /* =========================================
           TOUCH DEVICES
        ========================================= */

        @media (hover: none) {

            .chapter-card:hover {
                transform: none;

                border-color:
                    rgba(255, 255, 255, 0.08);

                background:
                    linear-gradient(
                        145deg,
                        rgba(22, 22, 25, 0.98),
                        rgba(7, 7, 9, 0.98)
                    );

                box-shadow:
                    0 12px 35px rgba(0, 0, 0, 0.45);
            }

            .chapter-card:hover .chapter-number {
                transform: none;
                text-shadow: none;
            }

            .chapter-card:hover .chapter-info h3 {
                transform: none;
                text-shadow: none;
            }

            .chapter-card:hover .chapter-arrow {
                transform: none;

                color: #ff1e2d;

                background:
                    rgba(255, 30, 45, 0.07);

                border-color:
                    rgba(255, 30, 45, 0.25);

                box-shadow: none;
            }

        }

    </style>
</head>


<body>

    <main class="notes-page">

        <!-- =========================================
             TOP
        ========================================== -->

        <div class="notes-top">

            <a
                href="notes-subject.html"
                class="back-link"
                id="backButton"
            >
                ← Subject
            </a>

        </div>


        <!-- =========================================
             HEADING
        ========================================== -->

        <section class="notes-heading">

            <div
                class="board-name"
                id="boardName"
            >
                BIHAR BOARD
            </div>

            <h1>
                <span id="subjectName">
                    Subject
                </span>
                Notes
            </h1>

            <p>
                अपना Chapter चुनें और Notes पढ़ें
            </p>

            <div class="heading-line"></div>

        </section>


        <!-- =========================================
             CHAPTERS
        ========================================== -->

        <div
            class="chapter-list"
            id="chapterList"
        ></div>

    </main>


    <script>

        /* =========================================
           URL DATA
        ========================================= */

        const params =
            new URLSearchParams(
                window.location.search
            );

        const subjectFromURL =
            params.get("subject");


        /* =========================================
           SAVE SUBJECT
        ========================================= */

        if (subjectFromURL) {

            localStorage.setItem(
                "selectedSubject",
                subjectFromURL
            );

        }


        const subject =
            localStorage.getItem(
                "selectedSubject"
            );


        const board =
            localStorage.getItem(
                "selectedBoard"
            );


        /* =========================================
           DISPLAY BOARD
        ========================================= */

        if (board) {

            document.getElementById(
                "boardName"
            ).textContent =
                board.toUpperCase();

        }


        /* =========================================
           DISPLAY SUBJECT
        ========================================= */

        if (subject) {

            document.getElementById(
                "subjectName"
            ).textContent =
                subject;

        }


        /* =========================================
           BACK BUTTON
        ========================================= */

        if (subject) {

            document.getElementById(
                "backButton"
            ).href =
                "notes-subject.html?subject=" +
                encodeURIComponent(subject);

        }


        /* =========================================
           CLASS 9 CHAPTERS
        ========================================= */

        const chapters = {

            "Hindi": [

                "दो बैलों की कथा",
                "ल्हासा की ओर",
                "उपभोक्तावाद की संस्कृति",
                "साँवले सपनों की याद",
                "नाना साहब की पुत्री देवी मैना को भस्म कर दिया गया",
                "प्रेमचंद के फटे जूते",
                "मेरे बचपन के दिन",
                "एक कुत्ता और एक मैना",
                "साखियाँ एवं सबद",
                "वाख",
                "सवैये",
                "कैदी और कोकिला",
                "ग्राम श्री",
                "चंद्र गहना से लौटती बेर",
                "मेघ आए",
                "यमराज की दिशा",
                "बच्चे काम पर जा रहे हैं"

            ],


            "English": [

                "The Fun They Had",
                "The Sound of Music",
                "The Little Girl",
                "A Truly Beautiful Mind",
                "The Snake and the Mirror",
                "My Childhood",
                "Reach for the Top",
                "Kathmandu",
                "If I Were You",
                "The Lost Child",
                "The Adventures of Toto",
                "Iswaran the Storyteller",
                "In the Kingdom of Fools",
                "The Happy Prince",
                "Weathering the Storm in Ersama",
                "The Last Leaf",
                "A House Is Not a Home",
                "The Beggar"

            ],


            "Mathematics": [

                "संख्या पद्धति",
                "बहुपद",
                "निर्देशांक ज्यामिति",
                "दो चरों वाले रैखिक समीकरण",
                "यूक्लिड की ज्यामिति का परिचय",
                "रेखाएँ और कोण",
                "त्रिभुज",
                "चतुर्भुज",
                "वृत्त",
                "हीरोन का सूत्र",
                "पृष्ठीय क्षेत्रफल और आयतन",
                "सांख्यिकी"

            ],


            "Science": [

                "हमारे आस-पास के पदार्थ",
                "क्या हमारे आस-पास के पदार्थ शुद्ध हैं?",
                "परमाणु एवं अणु",
                "परमाणु की संरचना",
                "जीवन की मौलिक इकाई — कोशिका",
                "ऊतक",
                "गति",
                "बल तथा गति के नियम",
                "गुरुत्वाकर्षण",
                "कार्य तथा ऊर्जा",
                "ध्वनि",
                "खाद्य संसाधनों में सुधार"

            ],


            "Social Science": [

                "भारत — आकार और स्थिति",
                "भारत के भौतिक स्वरूप",
                "अपवाह",
                "जलवायु",
                "प्राकृतिक वनस्पति तथा वन्य प्राणी",
                "जनसंख्या",
                "लोकतंत्र क्या है?",
                "संवैधानिक डिजाइन",
                "चुनावी राजनीति",
                "संस्थाओं का कामकाज",
                "लोकतांत्रिक अधिकार",
                "फ्रांसीसी क्रांति",
                "यूरोप में समाजवाद और रूसी क्रांति",
                "नात्सीवाद और हिटलर का उदय"

            ],


            "Computer": [

                "कंप्यूटर का परिचय",
                "कंप्यूटर की मूल बातें",
                "कंप्यूटर के प्रमुख भाग",
                "इनपुट और आउटपुट उपकरण",
                "मेमोरी और स्टोरेज",
                "ऑपरेटिंग सिस्टम",
                "फाइल और फोल्डर प्रबंधन",
                "इंटरनेट का परिचय",
                "वेब ब्राउज़र और सर्च इंजन",
                "ई-मेल",
                "साइबर सुरक्षा",
                "डिजिटल सुरक्षा और गोपनीयता"

            ]

        };


        /* =========================================
           CREATE CHAPTER CARDS
        ========================================== */

        const list =
            document.getElementById(
                "chapterList"
            );


        if (
            subject &&
            chapters[subject]
        ) {

            chapters[subject].forEach(
                function (
                    chapter,
                    index
                ) {

                    const card =
                        document.createElement(
                            "a"
                        );


                    card.className =
                        "chapter-card";


                    card.href =
                        "notes-chapter.html?subject=" +
                        encodeURIComponent(
                            subject
                        ) +
                        "&chapter=" +
                        encodeURIComponent(
                            chapter
                        );


                    card.innerHTML = `

                        <div class="chapter-number">

                            ${String(index + 1).padStart(2, "0")}

                        </div>


                        <div class="chapter-info">

                            <h3>
                                ${chapter}
                            </h3>

                            <p>
                                📘 Chapter Notes
                            </p>

                        </div>


                        <div class="chapter-arrow">
                            →
                        </div>

                    `;


                    /* CLICK ANIMATION */

                    card.addEventListener(
                        "click",
                        function () {

                            card.classList.add(
                                "clicked"
                            );

                        }
                    );


                    list.appendChild(
                        card
                    );

                }
            );

        } else {

            list.innerHTML = `

                <div class="chapter-card">

                    <div class="chapter-info">

                        <h3>
                            Chapter उपलब्ध नहीं है
                        </h3>

                        <p>
                            कृपया वापस जाकर Subject चुनें।
                        </p>

                    </div>

                </div>

            `;

        }

    </script>

</body>

</html>
