<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz - StudentHub4U</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #10233d 0%, #05070b 45%, #020304 100%);
            color: white;
            min-height: 100vh;
        }

        .header {
            height: 80px;
            padding: 0 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5, 8, 13, 0.95);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo span {
            color: #00aaff;
        }

        .back-link {
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
        }

        .back-link:hover {
            border-color: #00aaff;
        }

        .quiz-wrapper {
            width: 92%;
            max-width: 850px;
            margin: 50px auto;
        }

        .quiz-card {
            background: linear-gradient(145deg, #111923, #070a0e);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.45);
        }

        .quiz-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .subject-name {
            color: #00aaff;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .question-count {
            color: #aaa;
            font-size: 14px;
        }

        .chapter-title {
            font-size: 28px;
            margin-bottom: 18px;
        }

        .progress-box {
            width: 100%;
            height: 8px;
            background: #202832;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #00aaff;
            transition: width 0.3s ease;
        }

        .question-number {
            color: #00aaff;
            font-size: 15px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .question {
            font-size: 24px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 14px;
        }

        .option {
            width: 100%;
            padding: 17px 18px;
            background: #111820;
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 13px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: 0.25s;
        }

        .option:hover {
            border-color: #00aaff;
            transform: translateY(-2px);
        }

        .option.correct {
            background: #0d6b3b;
            border-color: #20d878;
            color: white;
        }

        .option.wrong {
            background: #8c1820;
            border-color: #ff3d4d;
            color: white;
        }

        .option:disabled {
            cursor: default;
        }

        .next-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #00aaff;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            display: none;
        }

        .next-btn:hover {
            background: #008ed6;
        }

        .result {
            display: none;
            text-align: center;
        }

        .result h2 {
            font-size: 34px;
            margin-bottom: 15px;
        }

        .score {
            font-size: 24px;
            color: #00c8ff;
            margin-bottom: 25px;
        }

        .restart-btn {
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: #00aaff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .home-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 22px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.15);
        }

        @media (max-width: 600px) {

            .header {
                padding: 0 5%;
                height: 70px;
            }

            .logo {
                font-size: 21px;
            }

            .quiz-wrapper {
                width: 94%;
                margin: 25px auto;
            }

            .quiz-card {
                padding: 22px;
                border-radius: 17px;
            }

            .chapter-title {
                font-size: 23px;
            }

            .question {
                font-size: 20px;
            }

            .option {
                font-size: 15px;
                padding: 15px;
            }

        }

    </style>

</head>

Q("यदि किसी डेटा का माध्य 8 है और 5 मान हैं तो उनका कुल योग कितना है?","13","40","45","50",1)

];


// ======================================================
// QUESTION BANK
// ======================================================

const questionBank = {

    "संख्या पद्धति": numberSystemQuestions,

    "बहुपद": polynomialQuestions,

    "निर्देशांक ज्यामिति": coordinateQuestions,

    "दो चरों वाले रैखिक समीकरण":
        linearQuestions,

    "यूक्लिड की ज्यामिति का परिचय":
        euclidQuestions,

    "रेखाएँ और कोण":
        linesAnglesQuestions,

    "त्रिभुज":
        triangleQuestions,

    "चतुर्भुज":
        quadrilateralQuestions,

    "वृत्त":
        circleQuestions,

    "हीरोन का सूत्र":
        heronQuestions,

    "पृष्ठीय क्षेत्रफल और आयतन":
        surfaceVolumeQuestions,

    "सांख्यिकी":
        statisticsQuestions

};


// ======================================================
// GET QUESTIONS
// ======================================================

const questions =
    questionBank[chapter] || [];


// ======================================================
// QUIZ VARIABLES
// ======================================================

let currentQuestion = 0;

let score = 0;

let answered = false;


// ======================================================
// ELEMENTS
// ======================================================

const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const questionNumberElement =
    document.getElementById("questionNumber");

const questionCountElement =
    document.getElementById("questionCount");

const progressBar =
    document.getElementById("progressBar");

const nextButton =
    document.getElementById("nextButton");

const resultElement =
    document.getElementById("result");

const scoreElement =
    document.getElementById("score");


// ======================================================
// QUESTION COUNT
// ======================================================

questionCountElement.textContent =
    questions.length + " Questions";


// ======================================================
// START QUIZ
// ======================================================

if (questions.length === 0) {

    document.getElementById("quizCard").innerHTML = `

        <div style="text-align:center; padding:40px 20px;">

            <h2 style="color:#ff4b58; margin-bottom:15px;">
                Quiz Available नहीं है
            </h2>

            <p style="color:#aaa;">
                Chapter name match नहीं हुआ।
            </p>

            <br>

            <a
                href="chapters.html"
                class="back-link"
            >
                ← Chapters पर जाएँ
            </a>

        </div>

    `;

} else {

    showQuestion();

}


// ======================================================
// SHOW QUESTION
// ======================================================

function showQuestion() {

    answered = false;

    nextButton.style.display = "none";

    nextButton.textContent =
        "Next Question →";


    const current =
        questions[currentQuestion];


    questionNumberElement.textContent =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    questionElement.textContent =
        current.question;


    progressBar.style.width =
        (
            (currentQuestion + 1) /
            questions.length *
            100
        ) + "%";


    optionsElement.innerHTML = "";


    current.options.forEach(
        function(optionText, index) {

            const button =
                document.createElement("button");


            button.className =
                "option";


            button.textContent =
                optionText;


            button.onclick =
                function() {

                    selectAnswer(
                        index,
                        button
                    );

                };


            optionsElement.appendChild(button);

        }
    );

}


// ======================================================
// SELECT ANSWER
// ======================================================

function selectAnswer(
    selectedIndex,
    selectedButton
) {

    if (answered) {
        return;
    }


    answered = true;


    const current =
        questions[currentQuestion];


    const allOptions =
        document.querySelectorAll(".option");


    allOptions.forEach(
        function(button) {

            button.disabled = true;

        }
    );


    if (
        selectedIndex ===
        current.answer
    ) {

        selectedButton.classList.add(
            "correct"
        );

        score++;

    } else {

        selectedButton.classList.add(
            "wrong"
        );


        allOptions[
            current.answer
        ].classList.add(
            "correct"
        );

    }


    nextButton.style.display =
        "block";


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        nextButton.textContent =
            "View Result";

    }

}


// ======================================================
// NEXT QUESTION
// ======================================================

nextButton.addEventListener(
    "click",
    function() {

        currentQuestion++;


        if (
            currentQuestion <
            questions.length
        ) {

            showQuestion();

        } else {

            showResult();

        }

    }
);


// ======================================================
// RESULT
// ======================================================

function showResult() {

    questionNumberElement.style.display =
        "none";

    questionElement.style.display =
        "none";

    optionsElement.style.display =
        "none";

    nextButton.style.display =
        "none";


    progressBar.style.width =
        "100%";


    resultElement.style.display =
        "block";


    scoreElement.textContent =
        "आपका Score: " +
        score +
        " / " +
        questions.length;

}


// ======================================================
// RESTART
// ======================================================

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    resultElement.style.display =
        "none";

    questionNumberElement.style.display =
        "block";

    questionElement.style.display =
        "block";

    optionsElement.style.display =
        "grid";


    showQuestion();

}

</script>
