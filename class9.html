<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Class 9 - StudentHub4U</title>

    <link rel="stylesheet" href="style.css">


    <style>

        /* =========================================
           PREMIUM SUBJECT GRID
        ========================================= */

        .subject-grid {

            width: 100%;

            max-width: 1150px;

            margin: 45px auto 70px;

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

        }


        /* =========================================
           SUBJECT CARD
        ========================================= */

        .subject-card {

            position: relative;

            min-height: 220px;

            padding: 26px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            text-decoration: none !important;

            color: #ffffff !important;

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 20, 26, 0.98),
                    rgba(5, 7, 11, 0.98)
                );

            border:
                1px solid
                rgba(0, 168, 255, 0.14);

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.45);

            transition:
                transform 0.4s ease,
                border-color 0.4s ease,
                box-shadow 0.4s ease,
                background 0.4s ease;

        }


        /* =========================================
           MOVING BLUE LIGHT
        ========================================= */

        .subject-card::before {

            content: "";

            position: absolute;

            top: 0;

            left: -120%;

            width: 100%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #008cff,
                    #00d9ff,
                    #008cff,
                    transparent
                );

            box-shadow:
                0 0 10px #008cff,
                0 0 22px rgba(0, 168, 255, 0.8);

            transition:
                left 0.8s ease;

        }


        .subject-card:hover::before {

            left: 120%;

        }


        /* =========================================
           BLUE AMBIENT GLOW
        ========================================= */

        .subject-card::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            right: -100px;

            bottom: -100px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(0, 168, 255, 0.28),
                    transparent 70%
                );

            opacity: 0.45;

            transition:
                transform 0.5s ease,
                opacity 0.5s ease;

            pointer-events: none;

        }


        /* =========================================
           HOVER
        ========================================= */

        .subject-card:hover {

            transform:
                translateY(-9px)
                scale(1.015);

            border-color:
                rgba(0, 174, 255, 0.75);

            background:
                linear-gradient(
                    145deg,
                    rgba(7, 25, 38, 0.98),
                    rgba(5, 8, 13, 0.98)
                );

            box-shadow:

                0 18px 45px
                rgba(0, 0, 0, 0.65),

                0 0 22px
                rgba(0, 168, 255, 0.18),

                inset 0 0 25px
                rgba(0, 168, 255, 0.035);

        }


        .subject-card:hover::after {

            transform:
                scale(1.7);

            opacity: 0.8;

        }


        /* =========================================
           NUMBER
        ========================================= */

        .subject-number {

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 2px;

            color: #00a8ff;

            transition:
                transform 0.35s ease,
                text-shadow 0.35s ease;

        }


        .subject-card:hover
        .subject-number {

            transform:
                translateX(4px);

            text-shadow:

                0 0 8px #008cff,

                0 0 18px
                rgba(0, 168, 255, 0.8);

        }


        /* =========================================
           SUBJECT NAME
        ========================================= */

        .subject-info {

            position: relative;

            z-index: 2;

            flex: 1;

            display: flex;

            flex-direction: column;

            justify-content: center;

            padding: 12px 0;

        }


        .subject-info h3 {

            margin:
                0 0 9px;

            color: #ffffff !important;

            font-size: 22px;

            line-height: 1.4;

            font-weight: 700;

            text-decoration: none !important;

            transition:
                transform 0.3s ease,
                text-shadow 0.3s ease;

        }


        .subject-card:hover
        .subject-info h3 {

            transform:
                translateX(4px);

            text-shadow:
                0 0 12px
                rgba(255, 255, 255, 0.2);

        }


        /* =========================================
           HINDI NAME
        ========================================= */

        .subject-info p {

            margin: 0;

            color: #858b94 !important;

            font-size: 14px;

            text-decoration: none !important;

            transition:
                color 0.3s ease;

        }


        .subject-card:hover
        .subject-info p {

            color: #b9c3ce !important;

        }


        /* =========================================
           ARROW
        ========================================= */

        .subject-arrow {

            position: absolute;

            right: 20px;

            bottom: 18px;

            width: 40px;

            height: 40px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            color: #00a8ff;

            background:
                rgba(0, 168, 255, 0.07);

            border:
                1px solid
                rgba(0, 168, 255, 0.25);

            font-size: 19px;

            transition:
                all 0.35s ease;

        }


        .subject-card:hover
        .subject-arrow {

            color: #ffffff;

            background:
                #008cff;

            border-color:
                #008cff;

            box-shadow:

                0 0 12px
                rgba(0, 140, 255, 0.8),

                0 0 28px
                rgba(0, 140, 255, 0.45);

            transform:
                translateX(5px);

        }


        /* =========================================
           CLICK ANIMATION
        ========================================= */

        .subject-card.clicked {

            transform:
                scale(0.94);

            border-color:
                #00a8ff;

            box-shadow:

                0 0 15px #008cff,

                0 0 40px
                rgba(0, 168, 255, 0.75),

                0 0 80px
                rgba(0, 168, 255, 0.3);

        }


        .subject-card.clicked::before {

            left: 120%;

        }


        .subject-card.clicked
        .subject-arrow {

            color: #ffffff;

            background:
                #008cff;

            border-color:
                #008cff;

            box-shadow:
                0 0 25px
                rgba(0, 168, 255, 0.9);

            transform:
                scale(1.15);

        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .subject-grid {

                grid-template-columns:
                    repeat(2, 1fr);

                padding:
                    0 20px;

            }

        }


        @media (max-width: 600px) {

            .subject-grid {

                grid-template-columns:
                    1fr;

                gap: 15px;

                margin-top: 30px;

                padding:
                    0 15px;

            }


            .subject-card {

                min-height: 190px;

                padding: 22px;

            }


            .subject-info h3 {

                font-size: 20px;

            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">
            <span>Student</span>Hub4U
        </div>


        <a
            href="board.html"
            class="back-link"
        >
            ← Bihar Board
        </a>

    </header>



    <!-- MAIN -->

    <main>

        <section
            class="boards-section class-page"
        >


            <div class="section-heading">

                <span id="selectedBoard">
                    BIHAR BOARD
                </span>


                <h2>
                    Class 9
                </h2>


                <p>
                    अपना Subject चुनें
                </p>

            </div>



            <!-- SUBJECTS -->

            <div
                class="subject-grid"
                id="subjectGrid"
            ></div>


        </section>

    </main>



    <script>


        /* =========================================
           BOARD
        ========================================== */

        const board =
            localStorage.getItem(
                "selectedBoard"
            );


        if (board) {

            document.getElementById(
                "selectedBoard"
            ).textContent =
                board.toUpperCase();

        }



        /* =========================================
           SUBJECT DATA
        ========================================== */

        const subjects = [

            {
                name: "Hindi",
                hindi: "हिंदी"
            },

            {
                name: "English",
                hindi: "English"
            },

            {
                name: "Mathematics",
                hindi: "गणित"
            },

            {
                name: "Science",
                hindi: "विज्ञान"
            },

            {
                name: "Social Science",
                hindi: "सामाजिक विज्ञान"
            },

            {
                name: "Computer",
                hindi: "कंप्यूटर"
            }

        ];



        /* =========================================
           CREATE CARDS
        ========================================== */

        const grid =
            document.getElementById(
                "subjectGrid"
            );


        subjects.forEach(
            function(
                subject,
                index
            ) {


                const card =
                    document.createElement(
                        "a"
                    );


                card.className =
                    "subject-card";


                card.href =
                    "subject.html?subject=" +
                    encodeURIComponent(
                        subject.name
                    );


                card.innerHTML = `

                    <div class="subject-number">

                        ${String(
                            index + 1
                        ).padStart(
                            2,
                            "0"
                        )}

                    </div>


                    <div class="subject-info">

                        <h3>
                            ${subject.name}
                        </h3>

                        <p>
                            ${subject.hindi}
                        </p>

                    </div>


                    <div class="subject-arrow">
                        →
                    </div>

                `;


                /* CLICK ANIMATION */

                card.addEventListener(
                    "click",
                    function() {

                        localStorage.setItem(
                            "selectedClass",
                            "Class 9"
                        );


                        localStorage.setItem(
                            "selectedSubject",
                            subject.name
                        );


                        card.classList.add(
                            "clicked"
                        );

                    }
                );


                grid.appendChild(
                    card
                );

            }
        );


    </script>


</body>

</html>
